name: pi-hindsight-e2e

services:
  hindsight:
    # Verified 1.1.0 manifest and local OCI version label, 2026-11-08.
    image: ghcr.io/vectorize-io/hindsight:1.1.0@sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06
    ports:
      - "127.0.0.1:18890:8888"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: none
      HINDSIGHT_API_RETAIN_EXTRACTION_MODE: chunks
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_STORE_DOCUMENT_TEXT: "true"
    volumes:
      - /home/hindsight/.pg0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 90
    stop_grace_period: 10s
